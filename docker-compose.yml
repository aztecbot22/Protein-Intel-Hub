services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: protein_hub
      POSTGRES_USER: protein
      POSTGRES_PASSWORD: protein
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://protein:protein@db:5432/protein_hub
      SECRET_KEY: change-me
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: http://localhost:8000/api
    depends_on:
      - api

volumes:
  db_data:
